name: native-gems

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream parsekit version to build, e.g. 0.2.0"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

env:
  RUBY_VERSION: "4.0"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-darwin
            runner: macos-latest
          - platform: x86_64-linux
            runner: ubuntu-22.04
          - platform: aarch64-linux
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - run: bin/fetch-upstream ${{ inputs.version }}

      - run: bundle install

      - name: Download tessdata for build
        run: |
          mkdir -p tessdata
          curl -fsSL https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -o tessdata/eng.traineddata

      - name: Build native gem
        working-directory: src
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
        run: bundle exec rake native gem

      - name: Strip the macOS version from the darwin gem platform
        if: runner.os == 'macOS'
        run: bin/generalize-darwin-platform src/pkg/parsekit-bin-${{ inputs.version }}-arm64-darwin-*.gem

      - name: Check gem name and version
        run: ls src/pkg/parsekit-bin-${{ inputs.version }}-*.gem

      - name: Load gem on Debian bookworm
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD/src/pkg:/pkg" ruby:4.0-slim-bookworm sh -c 'gem install /pkg/parsekit-bin-*.gem && ruby -e "require %q(parsekit); puts ParseKit.parse_bytes(%q(loaded on bookworm))"'

      - name: Load gem
        if: runner.os == 'macOS'
        run: gem install src/pkg/parsekit-bin-*.gem && ruby -e 'require "parsekit"; puts ParseKit.parse_bytes("loaded on macOS")'

      - uses: actions/upload-artifact@v4
        with:
          name: parsekit-bin-${{ matrix.platform }}
          path: src/pkg/parsekit-bin-${{ inputs.version }}-*.gem
          if-no-files-found: error

  publish:
    name: Publish gems to RubyGems
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - run: bin/fetch-upstream ${{ inputs.version }}

      - run: bundle install

      - name: Build source gem
        working-directory: src
        run: bundle exec rake build

      - uses: actions/download-artifact@v4
        with:
          pattern: parsekit-bin-*
          merge-multiple: true
          path: src/pkg

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - run: bin/publish-missing src/pkg
