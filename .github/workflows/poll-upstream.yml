name: poll-upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: compare
        run: echo "version=$(bin/version-to-build)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.version != ''
    uses: ./.github/workflows/native-gems.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.check.outputs.version }}
